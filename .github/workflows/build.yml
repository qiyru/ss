name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Arrange files into src layout
        shell: bash
        run: |
          if [ ! -d src ]; then
            mkdir src
            mv Merostrap.Macro vendor Directory.Build.props Merostrap.Macro.slnx global.json NuGet.Config src/
          fi

      - name: Publish single-file exe
        run: >
          dotnet publish src/Merostrap.Macro/Merostrap.Macro.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish_out

      - name: List output
        shell: bash
        run: ls -la publish_out

      - name: Upload full build folder
        uses: actions/upload-artifact@v4
        with:
          name: Merostrap-win-x64
          path: publish_out/
          if-no-files-found: error
